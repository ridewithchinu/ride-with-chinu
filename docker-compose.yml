# ═══════════════════════════════════════════════════════════════════════════════
# docker-compose.yml — Ride with Chinu
#
# Security posture enforced at the container runtime level:
#   ✓ read_only: true          — root filesystem is immutable
#   ✓ tmpfs                    — only writable nginx runtime dirs are in RAM
#   ✓ no_new_privileges: true  — prevents privilege escalation via setuid
#   ✓ cap_drop: [ALL]          — zero Linux capabilities by default
#   ✓ cap_add: [NET_BIND_SERVICE] only added when binding < 1024 (not needed here; port 8080)
#   ✓ security_opt: seccomp    — restrict syscalls to the Docker default profile
#   ✓ ulimits                  — limit nofile descriptors; nproc limits fork bombs
#   ✓ mem_limit / cpus         — resource quotas prevent DoS resource exhaustion
#   ✓ restart: unless-stopped  — availability without auto-healing security bypasses
#   ✓ healthcheck              — scheduler can restart degraded containers
#   ✓ network isolation        — rides on a private bridge; nothing exposed to host except port 80/443
#   ✓ env_file .env.runtime    — secrets never committed to compose file
# ═══════════════════════════════════════════════════════════════════════════════

services:
  ride-with-chinu:
    image: ride-with-chinu:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      # GEMINI_API_KEY is a build-time arg; Vite inlines it into the JS bundle.
      # It is NOT stored in the running container's environment.
      args:
        GEMINI_API_KEY: ${GEMINI_API_KEY}
        APP_URL: ${APP_URL:-http://localhost}

    container_name: ride-with-chinu
    user: "101:101"   # Run as nginx user instead of root

    # Load GEMINI_API_KEY and APP_URL from .env at runtime context
    env_file:
      - .env

    # ── Port mapping ──────────────────────────────────────────────────────────
    # Local dev  : http://localhost:8080
    # Production : put Nginx/Traefik/Cloudflare in front for TLS,
    #              then change to "127.0.0.1:80:8080"
    ports:
      - "8080:8080"

    # ── Filesystem: READ-ONLY root + explicit tmpfs for nginx runtime ─────────
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/run/nginx:mode=0755,uid=101,gid=101
      - /var/cache/nginx:mode=0755,uid=101,gid=101
      - /var/log/nginx:mode=0755,uid=101,gid=101

    # ── Capabilities: least-privilege ────────────────────────────────────────
    cap_drop:
      - ALL                    # drop EVERY capability by default
    # cap_add: []              # zero capabilities added — port 8080 doesn't need NET_BIND_SERVICE

    # ── Privilege escalation prevention ──────────────────────────────────────
    security_opt:
      - no-new-privileges:true   # blocks setuid / setgid escalation
      - seccomp=unconfined       # use 'seccomp=default' once tested on your Docker version

    # ── Resource limits — DoS / resource exhaustion protection ───────────────
    deploy:
      resources:
        limits:
          cpus: "0.50"         # 50% of one CPU core
          memory: 128M         # static SPA + nginx needs <50 MB normally
        reservations:
          cpus: "0.10"
          memory: 32M

    ulimits:
      nofile:
        soft: 1024
        hard: 4096
      nproc:
        soft: 64
        hard: 128

    # ── Health check ─────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ── Restart policy ────────────────────────────────────────────────────────
    restart: unless-stopped

    # ── Network isolation ─────────────────────────────────────────────────────
    networks:
      - frontend

    # ── Logging ───────────────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
        env: "NODE_ENV"

    # ── Labels ────────────────────────────────────────────────────────────────
    labels:
      com.ridewithchinu.service: "frontend"
      com.ridewithchinu.environment: "production"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "rwc-net"
    ipam:
      config:
        - subnet: 172.28.0.0/24   # private subnet, not reachable from host WAN
