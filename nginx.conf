# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Hardened Nginx for Ride with Chinu (Vite SPA)
#
# Rate-limit strategy (two zones):
#   Zone 1 [global_per_ip]   — global IP budget across ALL requests
#                              (blocks volumetric abuse / scanners)
#   Zone 2 [document_per_ip] — applied ONLY to the SPA shell (index.html)
#                              NOT applied to static assets — a single page
#                              load fires 50-100 asset requests simultaneously;
#                              rate-limiting them breaks the browser.
#
# Public folder access:
#   All files under /usr/share/nginx/html are reachable:
#     /images/**          → hero images, destination photos (public/images/)
#     /robots.txt         → search engine crawl rules
#     /sitemap.xml        → SEO sitemap
#     /google*.html       → Google Search Console verification
#     /assets/**          → Vite-fingerprinted JS/CSS chunks
# ─────────────────────────────────────────────────────────────────────────────

# Run native non-root — no setuid
# user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    # ── Hide server identity ──────────────────────────────────────────────────
    server_tokens  off;

    include        /etc/nginx/mime.types;
    default_type   application/octet-stream;

    # nginx:alpine's built-in mime.types already covers webp, avif, woff2, json etc.
    # No custom types block needed — adding duplicates here causes build warnings.

    # ── Rate-limit zones ──────────────────────────────────────────────────────
    # Zone 1: global per-IP budget (all requests combined)
    #   15 requests/min mirrors NetworkService AccessRateLimiter Tier 1.
    #   10m zone → ~160 000 unique IPs tracked simultaneously.
    limit_req_zone  $binary_remote_addr  zone=global_per_ip:10m    rate=15r/m;

    # Zone 2: SPA navigation / form submissions only
    #   Prevents rapid-fire page reloads and scripted crawls.
    limit_req_zone  $binary_remote_addr  zone=document_per_ip:10m  rate=30r/m;

    # Respond with 429 when throttled (matches .NET middleware)
    limit_req_status   429;

    # ── Request size cap ──────────────────────────────────────────────────────
    client_max_body_size  10m;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile         on;
    tcp_nopush       on;
    tcp_nodelay      on;
    keepalive_timeout  30s;

    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_comp_level   5;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    # ─────────────────────────────────────────────────────────────────────────
    # Server block
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen       8080;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ── Security headers applied to every response ────────────────────────
        add_header  X-Content-Type-Options    "nosniff"                      always;
        add_header  X-Xss-Protection          "1; mode=block"                always;
        add_header  X-Frame-Options           "SAMEORIGIN"                   always;
        add_header  Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header  Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header  Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Content-Security-Policy
        #   connect-src includes Google Generative AI (Gemini) endpoint
        #   img-src includes data: and blob: for inline thumbnails / lazy-load
        add_header  Content-Security-Policy
            "default-src 'self'; \
             script-src  'self'; \
             style-src   'self' 'unsafe-inline'; \
             img-src     'self' data: blob:; \
             font-src    'self'; \
             connect-src 'self' https://generativelanguage.googleapis.com; \
             frame-src   'none'; \
             object-src  'none'; \
             base-uri    'self'; \
             form-action 'self';"
            always;

        # ── Health check — no rate-limit, no logging ──────────────────────────
        location = /health {
            access_log  off;
            return 200  "OK\n";
            add_header  Content-Type text/plain;
        }

        # ── SEO / verification files (no rate limit, short TTL) ───────────────
        location ~ ^/(robots\.txt|sitemap\.xml|google[a-z0-9]+\.html)$ {
            expires     1d;
            add_header  Cache-Control "public, must-revalidate";
            access_log  off;
        }

        # ── Public images (public/images/**) — NO rate limit ─────────────────
        #   Served directly; a single page can load 20–40 destination photos.
        #   Content-addressed by filename → safe to cache aggressively.
        location /images/ {
            expires     30d;
            add_header  Cache-Control "public, immutable";
            access_log  off;
            # Still propagate security headers
            add_header  X-Content-Type-Options "nosniff" always;

            # Large images: allow range requests (needed for video/progressive JPEG)
            add_header  Accept-Ranges bytes;
        }

        # ── Vite fingerprinted assets (/assets/**) — NO rate limit ───────────
        #   Filename contains content-hash (e.g. vendor.a1b2c3.js).
        #   Infinite cache is safe; stale filenames simply won't be referenced.
        location /assets/ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
            access_log  off;
            add_header  X-Content-Type-Options "nosniff" always;
        }

        # ── Other static file types (fonts, icons at root, etc.) — NO rate limit
        location ~* \.(woff2?|ttf|eot|otf|ico|svg|webp|avif|gif|png|jpg|jpeg)$ {
            expires     30d;
            add_header  Cache-Control "public, immutable";
            access_log  off;
            add_header  X-Content-Type-Options "nosniff" always;
        }

        # ── Fingerprinted JS / CSS not under /assets/ ─────────────────────────
        location ~* \.(js|css|map)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
            access_log  off;
            add_header  X-Content-Type-Options "nosniff" always;
        }

        # ── Block hidden / dangerous file access ─────────────────────────────
        location ~ /\. {
            deny all;
            return 404;
        }

        location ~* \.(env|sh|bak|sql|log|git)$ {
            deny all;
            return 404;
        }

        # Block scripting extensions that should never exist in a static SPA
        location ~* \.(php|asp|aspx|cgi|pl|py|rb)$ {
            deny all;
            return 404;
        }

        # ── SPA shell — rate-limited document requests ────────────────────────
        #   Rate-limited to prevent automated crawling / DoS on index.html.
        #   Burst of 20 accommodates tab restores / hard refreshes.
        location / {
            limit_req   zone=global_per_ip    burst=30  nodelay;
            limit_req   zone=document_per_ip  burst=20  nodelay;

            try_files   $uri $uri/ /index.html;

            # SPA shell must never be cached by the browser — always fetch fresh
            add_header  Cache-Control "no-store, no-cache, must-revalidate";
            add_header  Pragma "no-cache";
        }
    }
}
